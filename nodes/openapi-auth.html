<script type="text/javascript">
  RED.nodes.registerType("openapi-auth", {
    category: "config",
    defaults: {
      name: { value: "" },
      mode: { value: "enforce" }
    },
    credentials: {
      apiKeys: { type: "text" },
      basicUsers: { type: "text" }
    },
    label: function () {
      return this.name || "openapi auth";
    }
  });
</script>

<script type="text/html" data-template-name="openapi-auth">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="API auth">
  </div>
  <div class="form-row">
    <label for="node-config-input-mode"><i class="fa fa-shield"></i> Mode</label>
    <select id="node-config-input-mode">
      <option value="enforce">Enforce (validate credentials)</option>
      <option value="extract">Extract only (flow decides)</option>
    </select>
  </div>
  <div class="form-row">
    <label style="vertical-align:top" for="node-config-input-apiKeys"><i class="fa fa-key"></i> API keys</label>
    <textarea id="node-config-input-apiKeys" rows="3" style="width:70%;font-family:monospace"
      placeholder="one key per line (or comma-separated)"></textarea>
  </div>
  <div class="form-row">
    <label style="vertical-align:top" for="node-config-input-basicUsers"><i class="fa fa-user"></i> Basic users</label>
    <textarea id="node-config-input-basicUsers" rows="3" style="width:70%;font-family:monospace"
      placeholder="user:password per line"></textarea>
  </div>
</script>

<script type="text/html" data-help-name="openapi-auth">
  <p>Configures authentication derived from the spec's <code>securitySchemes</code>. In
  <b>enforce</b> mode credentials are checked against the configured API keys / basic users;
  in <b>extract</b> mode the token is pulled from the request and passed to the flow in
  <code>msg.auth</code> for custom handling. Secrets are stored as Node-RED credentials.</p>
</script>
